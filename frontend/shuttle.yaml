# FlowMatch frontend deployment config - "3 YAML approach"
# (https://atlas.bankingcircle.com/kubernetes-foundation).
plan: git://git@ssh.dev.azure.com:v3/banking-circle-payment-systems/DevelopmentExcellence/devops.shuttle.plan.simpleApp.v2#3.5.5
vars:
  docker:
    destImage: flowmatch/frontend
    port: 8080
  k8s:
    replicas: 1
  app:
    prefix: flowmatch
    name: frontend
  environments:
    path: environments
  healthCheck:
    enabled: true
    endpoint: /health
  requests:
    cpu: 0.05
    memory: 32Mi
  limits:
    cpu: 0.2
    memory: 64Mi
