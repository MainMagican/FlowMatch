server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the Kubernetes Foundation / shuttle plan health-check convention
    # (see shuttle.yaml healthCheck.endpoint) without needing a Flask process.
    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Rendered at container start by docker-entrypoint.sh into /tmp (the one
    # writable path under the read-only root filesystem) instead of directly
    # into the static content root.
    location = /config.js {
        alias /tmp/config.js;
        add_header Content-Type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
