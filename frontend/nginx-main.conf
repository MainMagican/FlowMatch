# Overrides the base nginx:1.27-alpine image's /etc/nginx/nginx.conf.
#
# Needed because the Helm Blueprint's default pod securityContext sets
# readOnlyRootFilesystem: nginx normally creates its pid file and several
# body/proxy temp directories under /var/run and /var/cache/nginx at
# startup, which now fail with "Read-only file system". Everything below
# is redirected to /tmp, the one path backed by a writable emptyDir even
# under that policy (same pattern as docker-entrypoint.sh's config.js and
# the backend's SQLite DB path).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The base image symlinks these to /dev/stdout and /dev/stderr, so
    # writing to them doesn't require a writable /var/log/nginx directory.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile        on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
