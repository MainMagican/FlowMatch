# FlowMatch backend CI/CD pipeline - Helm Blueprint based.
# Modeled on the platform's reference example:
# https://dev.azure.com/banking-circle-payment-systems/DevelopmentExcellence/_git/devops.templates.kubernetes?path=/examples/helmApp/pipeline.yml
#
# Replaces the earlier shuttle-based pipeline: shuttle has been deprecated by
# the platform team (confirmed by Atlas Support, 2026-09-21) in favor of the
# devops.helm.blueprint Helm chart + the helm.yml template. No SSH key is
# required - the config-repo checkout uses the pipeline's own identity.
#
# Prerequisites (one-time, already done):
#   1. Kubernetes Foundation "flowmatch" merged (devops.platform.configuration
#      PR #134634) - creates the flowmatch-aks-dev-vars variable group and
#      the flowmatch.gitops repo in this Azure DevOps project.
#   2. ACR: shared platform registry "devopsplatformregistry<env>".
#   3. Application values live in backend/values/<env>/<region>-aks-shared-<env>/values.yaml

resources:
  repositories:
    - repository: templates
      name: DevelopmentExcellence/devops.templates.kubernetes
      type: git
      ref: refs/tags/7.7.5 # latest confirmed tag as of 2026-09-21
    - repository: config-repo
      name: CommercialDigitalization/flowmatch.gitops
      type: git

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - aind/FlowMatch/backend/*

parameters:
  - name: imageTag
    type: string
    default: $(Build.BuildNumber)
  - name: skipSecurityScanWithCrReason
    displayName: "Skips security scan entirely. Keep as single space by default, or send a CR reason to skip."
    type: string
    default: " "
  - name: environments
    type: object
    default:
      - dev
      # - uat
      # - prd

pool: devops-platform-ubuntu

stages:
  - stage: build
    jobs:
      - job: build
        steps:
          - checkout: self
          - bash: |
              docker build -t flowmatch/backend:${{ parameters.imageTag }} aind/FlowMatch/backend
            displayName: "Build backend image"
          - bash: |
              docker save $IMAGE_NAME:$IMAGE_TAG -o $(Pipeline.Workspace)/image.tar
            displayName: Save Docker Image
            env:
              IMAGE_NAME: flowmatch/backend
              IMAGE_TAG: ${{ parameters.imageTag }}
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Pipeline.Workspace)/image.tar"
              artifact: "DOCKER_IMAGE_PRESCAN"
              publishLocation: "pipeline"
      - job: tests
        dependsOn: build
        steps:
          - checkout: self
          - bash: |
              cd aind/FlowMatch/backend
              pip install -r requirements.txt --quiet
              python -m pytest tests -q
            displayName: "Run backend tests"

  - stage: scan
    dependsOn: build
    jobs:
      - job: scan
        variables:
          - group: flowmatch-aks-dev-vars
        steps:
          - template: scan.yml@templates
            parameters:
              skipSecurityScanWithCrReason: ${{ parameters.skipSecurityScanWithCrReason }}
              imageName: flowmatch/backend
              clientId: $(flowmatch-client-id)
              clientSecret: $(flowmatch-client-secret)
              tenantId: 1eef4a4d-f7cc-4e1e-9345-5db4051d2bc1
              subscriptionId: c5a18394-3494-4adf-9d55-ee137d6f869c

  - stage: push
    dependsOn: scan
    jobs:
      - ${{ each env in parameters.environments }}:
          - job: push_${{env}}
            variables:
              - group: flowmatch-aks-${{env}}-vars
            steps:
              - template: push.yml@templates
                parameters:
                  imageName: flowmatch/backend
                  registryName: devopsplatformregistry${{env}}
                  clientId: $(flowmatch-client-id)
                  clientSecret: $(flowmatch-client-secret)
                  tenantId: 1eef4a4d-f7cc-4e1e-9345-5db4051d2bc1
                  ${{ if eq(env,'prd') }}:
                    subscriptionId: 83c90639-bb01-45e3-9973-93995ef67779
                  ${{ else }}:
                    subscriptionId: c5a18394-3494-4adf-9d55-ee137d6f869c

  - ${{ each env in parameters.environments }}:
      - stage: deploy_${{env}}
        jobs:
          - job: deploy
            variables:
              - group: flowmatch-aks-${{env}}-vars
            steps:
              - template: helm.yml@templates
                parameters:
                  configRepo: flowmatch.gitops
                  appName: backend
                  valuesPath: aind/FlowMatch/backend/values
                  environment: ${{env}}
                  prefix: flowmatch
                  clientId: $(flowmatch-client-id)
                  clientSecret: $(flowmatch-client-secret)
                  tenantId: 1eef4a4d-f7cc-4e1e-9345-5db4051d2bc1
                  ${{ if eq(env,'prd') }}:
                    subscriptionId: 83c90639-bb01-45e3-9973-93995ef67779
                  ${{ else }}:
                    subscriptionId: c5a18394-3494-4adf-9d55-ee137d6f869c
          - job: validation
            dependsOn: deploy
            steps:
              - bash: |
                  curl --fail https://flowmatch-backend-${{env}}.kubernetes.bankingcircle.net/api/health
                displayName: "Smoke test /api/health"
