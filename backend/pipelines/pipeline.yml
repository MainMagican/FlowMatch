# FlowMatch backend CI/CD pipeline.
# Modeled on the platform's reference example:
# https://dev.azure.com/banking-circle-payment-systems/DevelopmentExcellence/_git/devops.templates.kubernetes?path=/examples/simpleApp/pipeline.yml
#
# Prerequisites (one-time, before this pipeline can run):
#   1. Kubernetes Foundation "flowmatch" must be merged (devops.platform.configuration
#      PR #134634 - DONE) - this creates the flowmatch-aks-dev-vars variable
#      group (with flowmatch-client-id / flowmatch-client-secret secrets) and
#      the flowmatch.gitops repo in this Azure DevOps project.
#   2. Generate an SSH key pair locally (`ssh-keygen`). Upload the public key
#      to your Azure DevOps user settings (SSH public keys), and upload the
#      private key as a Secure File named `id_shuttle_ado` in this project's
#      Pipeline Library - shuttle uses it to push manifests to flowmatch.gitops.
#   3. Confirm the ACR name with Atlas Support (placeholder below assumes
#      "flowmatchregistry<env>" - the platform team will tell you the real one
#      if it differs, e.g. a shared registry).
#   4. Create this pipeline in Azure DevOps pointing at this file, and set the
#      imageTag default if you don't want to rely on $(Build.BuildNumber).

resources:
  repositories:
    - repository: templates
      name: DevelopmentExcellence/devops.templates.kubernetes
      type: git
      ref: refs/tags/6 # bump to the latest tag: check the repo's Tags list

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - aind/FlowMatch/backend/*

parameters:
  - name: imageTag
    type: string
    default: $(Build.BuildNumber)
  - name: skipSecurityScanWithCrReason
    displayName: "Skips security scan entirely. Keep as single space by default, or send a CR reason to skip."
    type: string
    default: " "
  - name: environments
    type: object
    default:
      - dev
      # - uat
      # - prd

pool: devops-platform-ubuntu

stages:
  - stage: build
    jobs:
      - job: build
        steps:
          - checkout: self
          - bash: |
              docker build -t flowmatch/backend:${{ parameters.imageTag }} aind/FlowMatch/backend
            displayName: "Build backend image"
          - bash: |
              docker save $IMAGE_NAME:$IMAGE_TAG -o $(Pipeline.Workspace)/image.tar
            displayName: Save Docker Image
            env:
              IMAGE_NAME: flowmatch/backend
              IMAGE_TAG: ${{ parameters.imageTag }}
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Pipeline.Workspace)/image.tar"
              artifact: "DOCKER_IMAGE_PRESCAN"
              publishLocation: "pipeline"
      - job: tests
        dependsOn: build
        steps:
          - checkout: self
          - bash: |
              cd aind/FlowMatch/backend
              pip install -r requirements.txt --quiet
              python -m pytest tests -q
            displayName: "Run backend tests"

  - stage: scan
    dependsOn: build
    jobs:
      - job: scan
        variables:
          - group: flowmatch-aks-dev-vars
        steps:
          - template: scan.yml@templates
            parameters:
              skipSecurityScanWithCrReason: ${{ parameters.skipSecurityScanWithCrReason }}
              imageName: flowmatch/backend

  - stage: push
    dependsOn: scan
    jobs:
      - ${{ each env in parameters.environments }}:
          - job: push_${{env}}
            variables:
              - group: flowmatch-aks-${{env}}-vars
            steps:
              - template: push.yml@templates
                parameters:
                  imageName: flowmatch/backend
                  registryName: flowmatchregistry${{env}} # confirm with Atlas Support
                  clientId: $(flowmatch-client-id)
                  clientSecret: $(flowmatch-client-secret)
                  tenantId: 1eef4a4d-f7cc-4e1e-9345-5db4051d2bc1
                  ${{ if eq(env,'prd') }}:
                    subscriptionId: 83c90639-bb01-45e3-9973-93995ef67779
                  ${{ else }}:
                    subscriptionId: c5a18394-3494-4adf-9d55-ee137d6f869c

  - ${{ each env in parameters.environments }}:
      - stage: deploy_${{env}}
        jobs:
          - job: deploy
            variables:
              - group: flowmatch-aks-${{env}}-vars
            steps:
              - template: deploy.yml@templates
                parameters:
                  configRepo: flowmatch.gitops
                  pathToShuttle: aind/FlowMatch/backend
                  prefix: flowmatch
                  appName: backend
                  environment: ${{env}}
                  version: ${{ parameters.imageTag }}
                  clientId: $(flowmatch-client-id)
                  clientSecret: $(flowmatch-client-secret)
                  alwaysRestartPods: true
                  tenantId: 1eef4a4d-f7cc-4e1e-9345-5db4051d2bc1
                  ${{ if eq(env,'prd') }}:
                    subscriptionId: 83c90639-bb01-45e3-9973-93995ef67779
                  ${{ else }}:
                    subscriptionId: c5a18394-3494-4adf-9d55-ee137d6f869c
          - job: validation
            dependsOn: deploy
            steps:
              - bash: |
                  curl --fail https://flowmatch-backend-${{env}}.kubernetes.bankingcircle.net/api/health
                displayName: "Smoke test /api/health"
