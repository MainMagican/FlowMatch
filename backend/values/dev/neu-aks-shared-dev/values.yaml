environment: dev
region: neu

app:
  prefix: flowmatch
  name: backend
  healthCheck:
    enabled: true
    endpoint: /api/health
    timeoutSeconds: 30

image:
  name: flowmatch/backend
  port: 8100
  # tag intentionally omitted: the helm.yml pipeline template injects the
  # build's image tag automatically at deploy time (matches push.yml).

deployment:
  replicas: 1

resources:
  cpu: "0.5"
  memory: "256Mi"

ingress:
  enabled: true
  dns: flowmatch-backend

envVariables:
  # The Helm Blueprint's pod securityContext sets readOnlyRootFilesystem, so
  # the image's default /data path and the non-root user's home directory are
  # both unwritable at runtime. /tmp is backed by a writable emptyDir even
  # under that policy. Set here (not only in the Dockerfile) because Kubernetes
  # env vars override the image's ENV and take effect without an image rebuild.
  FLOWMATCH_DB_PATH: "/tmp/flowmatch.db"
  HOME: "/tmp"
  FLOWMATCH_FRONTEND_URL: "https://flowmatch-dev.kubernetes.bankingcircle.net"
  AZURE_REDIRECT_URI: "https://flowmatch-backend-dev.kubernetes.bankingcircle.net/api/auth/sso/callback"
  # FLOWMATCH_SSO_* rather than AZURE_*: the Azure Workload Identity webhook
  # injects its own AZURE_CLIENT_ID / AZURE_TENANT_ID for the pod's managed
  # identity and would overwrite these, making MSAL authenticate as the pod
  # instead of the SSO app registration.
  FLOWMATCH_SSO_CLIENT_ID: "0992b908-b35d-48b6-98db-fbbb81c4cc67"
  FLOWMATCH_SSO_TENANT_ID: "1eef4a4d-f7cc-4e1e-9345-5db4051d2bc1"
  SSO_ALLOWED_EMAIL_DOMAIN: "bankingcircle.com"

# Each entry renders a SecretStore + ExternalSecret (extraSecrets.yaml in the
# devops.helm.blueprint chart) and an envFrom.secretRef on the deployment.
# keyvaultName must match the real vault exactly: the chart builds the vault
# URL as https://<keyvaultName>.vault.azure.net and the generated Secret name
# as <app.name>-<keyvaultName>-app-config-secret-<environment>.
# NOTE: the vault really is "flowmatc" (no trailing h) - verified in the Azure
# portal. Do not "correct" it to flowmatch.
# secrets maps ENV_VAR_NAME -> Key Vault secret name.
envFromKeyvault:
  - keyvaultName: flowmatc-aks-kv-sps-dev
    secrets:
      FLOWMATCH_SSO_CLIENT_SECRET: FlowMatchSSO-01102026
